openapi: 3.1.0
info:
  title: KripAI native Windows — chat, głos, pliki i pamięć PDF
  version: 1.10.0
  description: HTTP tylko localhost. Sesje, CSRF, Owner ACL. Daty w odpowiedziach
    jako Unix seconds.
servers:
- url: http://localhost:8765/api/v1
security:
- sessionCookie: []
paths:
  /system/gpu:
    get:
      summary: Pomiar VRAM całych kart NVIDIA, cache 5 s (sesja, tylko odczyt)
      responses:
        '200':
          description: available, devices (index/name/used_mib/total_mib/free_mib), sampled_at lub jawny error; context_tokens i output_tokens_per_segment
        '401':
          description: Wymagane logowanie
  /integrations/mcp/test:
    post:
      summary: Rzeczywisty handshake MCP i odczyt katalogu (sesja i CSRF)
      responses:
        '200':
          description: Stan available, liczba documents lub jawny kod error; tylko odczyt
  /integrations/mcp/catalog:
    get:
      summary: Katalog dokumentów programu (sesja)
      responses:
        '200':
          description: Lista paths i flaga truncated
  /integrations/mcp/document:
    get:
      summary: Oryginalny tekst dokumentacji programu (sesja)
      parameters:
      - name: path
        in: query
        required: true
        schema: {type: string, maxLength: 200}
      responses:
        '200':
          description: Tekst UTF-8 do 12000 znaków
          content:
            text/plain:
              schema: {type: string}
        '404':
          description: Dokument niedostępny lub poza dozwolonym zakresem
  /integrations/github/drafts/{did}/reconcile:
    post:
      summary: Odczytowe sprawdzenie wyniku niepewnej publikacji (owner i CSRF)
      parameters:
      - name: did
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: published, branch_only lub outcome_unknown; bez zdalnego zapisu
        '409':
          description: Niepasująca zawartość gałęzi lub brak operacji do uzgodnienia
  /integrations/github/connect:
    post:
      summary: Test i zapis lokalnego połączenia GitHub przez DPAPI (owner i CSRF)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [repositories, token]
              properties:
                repositories:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                token:
                  type: string
                  writeOnly: true
                  maxLength: 512
                write:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Login i repozytoria bez tokenu
        '409':
          description: Błąd połączenia lub konfiguracji
        '403':
          description: Brak uprawnień owner, CSRF lub Origin
  /integrations/github/disconnect:
    post:
      summary: Lokalne odłączenie z kopią zaszyfrowanej konfiguracji (owner i CSRF)
      responses:
        '204':
          description: Odłączono lokalnie; token wymaga osobnego unieważnienia w GitHub
  /integrations/github/drafts:
    get:
      summary: Lokalne propozycje zmian należące do zalogowanego owner
      responses:
        '200':
          description: Lista propozycji, diffów i stanu publikacji
        '401':
          description: Brak sesji
  /integrations/github/drafts/{did}/publish:
    post:
      summary: Nowa gałąź i PR w lokalnie dozwolonym repozytorium
      parameters:
      - name: did
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: URL PR i gałąź; ponowienie zakończonej operacji zwraca ten sam wynik
        '403':
          description: CSRF lub Origin/Host
        '409':
          description: Brak konfiguracji, konflikt head lub niepewny wynik poprzedniej operacji
  /auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 128
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  writeOnly: true
      responses:
        '204':
          description: Sesja HttpOnly, SameSite=Strict; Secure=False wyłącznie na
            lokalnym HTTP
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      parameters:
      - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Sesja unieważniona
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      responses:
        '200':
          description: Bieżący użytkownik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /conversations:
    post:
      parameters:
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
      responses:
        '201':
          description: Utworzona rozmowa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'
    get:
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Strona rozmów
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /conversations/{conversation_id}:
    parameters:
    - $ref: '#/components/parameters/ConversationId'
    get:
      responses:
        '200':
          description: Rozmowa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /conversations/{conversation_id}/messages:
    parameters:
    - $ref: '#/components/parameters/ConversationId'
    get:
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Strona historii
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
      description: Ostatnia strona historii w kolejności chronologicznej; next_cursor
        wskazuje seq do pobrania starszych wiadomości.
    post:
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
      responses:
        '202':
          description: Utworzony run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCreated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Tekst i opcjonalne attachment_id istniejącego PNG/JPEG właściciela.
        Odpowiedź VLM w zwykłym run/SSE i historii. Idempotencja obejmuje obraz.
  /runs/{run_id}:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      responses:
        '200':
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /runs/{run_id}/cancel:
    parameters:
    - $ref: '#/components/parameters/RunId'
    post:
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Żądanie anulowania przyjęte
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /runs/{run_id}/events:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      parameters:
      - in: header
        name: Last-Event-ID
        required: false
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: SSE; id sequence, event type, data JSON
          content:
            text/event-stream:
              schema:
                type: string
        '410':
          description: Kursor wygasł, pobierz snapshot
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /system/status:
    get:
      responses:
        '200':
          description: Status zależności i trybu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /system/mode:
    post:
      parameters:
      - $ref: '#/components/parameters/CSRF'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - mode
              properties:
                mode:
                  enum:
                  - normal
                  - gaming
      responses:
        '202':
          description: Zapisano wyłącznie żądany tryb; właściciel wykonuje przełączenie
            ręcznie
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /health/live:
    get:
      security: []
      responses:
        '200':
          description: Lokalny stan procesu/bazy
  /health/ready:
    get:
      security: []
      responses:
        '200':
          description: Lokalny stan procesu/bazy
  /voice/jobs/{job_id}/transcribe:
    post:
      summary: Lokalny STT; zwraca tekst do korekty, nie wysyła wiadomości
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CSRF'
      - name: language
        in: query
        schema:
          type: string
          enum:
          - pl
          - en
          default: pl
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
              description: Dokładny WAV PCM16 mono 16 kHz, 0.25–30 s, 960044 B maks.
      responses:
        '200':
          description: Transkrypcja
          content:
            application/json:
              schema:
                type: object
                required:
                - text
                - language
                properties:
                  text:
                    type: string
                    maxLength: 4000
                  language:
                    type: string
                    enum:
                    - pl
                    - en
        '415':
          description: Wymagany Content-Type audio/wav
        '401':
          description: Sesja wymagana
        '403':
          description: Origin lub CSRF niedozwolony
        '409':
          description: Gaming, głos zajęty albo UUID anulowany/zużyty
        '413':
          description: Przekroczony limit body
        '422':
          description: Nieprawidłowy WAV, tekst albo język
        '429':
          description: Limit 256 UUID/10 minut
        '503':
          description: Silnik lub głos niedostępny
        '504':
          description: Timeout silnika
  /voice/jobs/{job_id}/speak:
    post:
      summary: Lokalny TTS System.Speech, jedna porcja tekstu
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - text
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 1200
                language:
                  type: string
                  enum:
                  - pl
                  - en
                  default: pl
      responses:
        '200':
          description: WAV do lokalnego odtworzenia
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '401':
          description: Sesja wymagana
        '403':
          description: Origin lub CSRF niedozwolony
        '409':
          description: Gaming, głos zajęty albo UUID anulowany/zużyty
        '413':
          description: Przekroczony limit body
        '422':
          description: Nieprawidłowy WAV, tekst albo język
        '429':
          description: Limit 256 UUID/10 minut
        '503':
          description: Silnik lub głos niedostępny
        '504':
          description: Timeout silnika
  /voice/jobs/{job_id}/cancel:
    post:
      summary: Anuluj UUID wyłącznie w bieżącej sesji; działa także przed rozpoczęciem
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/CSRF'
      responses:
        '204':
          description: Anulowanie przyjęte
        '401':
          description: Sesja wymagana
        '403':
          description: Origin lub CSRF niedozwolony
        '429':
          description: Limit 256 UUID/10 minut
  /files:
    get:
      summary: Files
      operationId: files_api_v1_files_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Attachment'
        '401':
          description: Sesja wymagana
        '403':
          description: Origin/CSRF odrzucone
        '404':
          description: Brak pliku właściciela
        '409':
          description: Anulowano, Gaming, zajęty model lub limit plików
        '413':
          description: Upload przekracza 8 MiB
        '503':
          description: Błąd dekodera, modelu, kopii lub bazy
        '504':
          description: Timeout
  /media/jobs/{job_id}/files:
    post:
      summary: Upload File
      operationId: upload_file_api_v1_media_jobs__job_id__files_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      - name: name
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 180
          title: Name
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Sesja wymagana
        '403':
          description: Origin/CSRF odrzucone
        '404':
          description: Brak pliku właściciela
        '409':
          description: Anulowano, Gaming, zajęty model lub limit plików
        '413':
          description: Upload przekracza 8 MiB
        '503':
          description: Błąd dekodera, modelu, kopii lub bazy
        '504':
          description: Timeout
      requestBody:
        required: true
        description: Surowy PNG/JPEG/PDF do 8 MiB; faktyczny format sprawdzany przez
          dekoder.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /files/{aid}:
    get:
      summary: File Metadata
      operationId: file_metadata_api_v1_files__aid__get
      parameters:
      - name: aid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Aid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Sesja wymagana
        '403':
          description: Origin/CSRF odrzucone
        '404':
          description: Brak pliku właściciela
        '409':
          description: Anulowano, Gaming, zajęty model lub limit plików
        '413':
          description: Upload przekracza 8 MiB
        '503':
          description: Błąd dekodera, modelu, kopii lub bazy
        '504':
          description: Timeout
    delete:
      summary: Delete File
      operationId: delete_file_api_v1_files__aid__delete
      parameters:
      - name: aid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Aid
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Sesja wymagana
        '403':
          description: Origin/CSRF odrzucone
        '404':
          description: Brak pliku właściciela
        '409':
          description: Anulowano, Gaming, zajęty model lub limit plików
        '413':
          description: Upload przekracza 8 MiB
        '503':
          description: Błąd dekodera, modelu, kopii lub bazy
        '504':
          description: Timeout
  /files/{aid}/preview:
    get:
      summary: File Preview
      operationId: file_preview_api_v1_files__aid__preview_get
      parameters:
      - name: aid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Aid
      responses:
        '200':
          description: Successful Response
          content:
            image/png:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Sesja wymagana
        '403':
          description: Origin/CSRF odrzucone
        '404':
          description: Brak pliku właściciela
        '409':
          description: Anulowano, Gaming, zajęty model lub limit plików
        '413':
          description: Upload przekracza 8 MiB
        '503':
          description: Błąd dekodera, modelu, kopii lub bazy
        '504':
          description: Timeout
  /files/{aid}/download:
    get:
      summary: File Download
      operationId: file_download_api_v1_files__aid__download_get
      parameters:
      - name: aid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Aid
      responses:
        '200':
          description: Successful Response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Sesja wymagana
        '403':
          description: Origin/CSRF odrzucone
        '404':
          description: Brak pliku właściciela
        '409':
          description: Anulowano, Gaming, zajęty model lub limit plików
        '413':
          description: Upload przekracza 8 MiB
        '503':
          description: Błąd dekodera, modelu, kopii lub bazy
        '504':
          description: Timeout
  /media/jobs/{job_id}/files/{aid}/page:
    post:
      summary: File Page
      operationId: file_page_api_v1_media_jobs__job_id__files__aid__page_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      - name: aid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Aid
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaPage'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Sesja wymagana
        '403':
          description: Origin/CSRF odrzucone
        '404':
          description: Brak pliku właściciela
        '409':
          description: Anulowano, Gaming, zajęty model lub limit plików
        '413':
          description: Upload przekracza 8 MiB
        '503':
          description: Błąd dekodera, modelu, kopii lub bazy
        '504':
          description: Timeout
  /media/jobs/{job_id}/files/{aid}/analyze:
    post:
      summary: File Analyze
      operationId: file_analyze_api_v1_media_jobs__job_id__files__aid__analyze_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      - name: aid
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Aid
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageQuestion'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                    maxLength: 12000
                  source:
                    type: string
                    enum:
                    - pdf_text
                    - vision
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Sesja wymagana
        '403':
          description: Origin/CSRF odrzucone
        '404':
          description: Brak pliku właściciela
        '409':
          description: Anulowano, Gaming, zajęty model lub limit plików
        '413':
          description: Upload przekracza 8 MiB
        '503':
          description: Błąd dekodera, modelu, kopii lub bazy
        '504':
          description: Timeout
  /media/jobs/{job_id}/cancel:
    post:
      summary: Cancel Media
      operationId: cancel_media_api_v1_media_jobs__job_id__cancel_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Job Id
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: Sesja wymagana
        '403':
          description: Origin/CSRF odrzucone
        '404':
          description: Brak pliku właściciela
        '409':
          description: Anulowano, Gaming, zajęty model lub limit plików
        '413':
          description: Upload przekracza 8 MiB
        '503':
          description: Błąd dekodera, modelu, kopii lub bazy
        '504':
          description: Timeout
  /rag/documents:
    get:
      summary: PDF-y właściciela i postęp ich indeksowania
      responses:
        '200':
          description: Lista items z id, filename, pages, status, next_page, chunks, error_code i space
  /rag/documents/{aid}/index:
    parameters:
    - name: aid
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      summary: Indeksuj lub wznów PDF; rebuild usuwa poprzedni indeks po kopii
      description: Sesja, Origin i X-CSRF-Token. PDF z tekstem; max 50 stron. Powtórne zlecenie nie dubluje gotowych stron.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                rebuild: {type: boolean, default: false}
      responses:
        '202': {description: Zadanie queued lub istniejący gotowy indeks}
        '404': {description: Brak pliku właściciela}
        '409': {description: Gaming lub indeksowanie już trwa}
  /rag/documents/{aid}/pause:
    parameters:
    - name: aid
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      summary: Wstrzymaj zadanie indeksowania właściciela
      description: Sesja, Origin i X-CSRF-Token. Niezapisana strona nie jest zatwierdzana.
      responses:
        '204': {description: Wstrzymano lub zadanie już nie pracuje}
  /rag/documents/{aid}:
    parameters:
    - name: aid
      in: path
      required: true
      schema: {type: string, format: uuid}
    delete:
      summary: Usuń indeks, fragmenty i wycinki cytowań po kopii; PDF pozostaje
      description: Sesja, Origin i X-CSRF-Token. Usunięcie źródłowego pliku usuwa także ten indeks.
      responses:
        '204': {description: Indeks usunięty}
        '503': {description: Brak potwierdzonej kopii; dane zachowane}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: assistant_session
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 256
  schemas:
    User:
      type: object
      required:
      - id
      - username
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    ConversationCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
    Conversation:
      type: object
      required:
      - id
      - title
      - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        created_at:
          type: number
          description: Unix seconds UTC
    MessageCreate:
      properties:
        text:
          type: string
          maxLength: 4000
          minLength: 1
          title: Text
        client_message_id:
          type: string
          format: uuid
          title: Client Message Id
        attachment_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Attachment Id
        allow_web:
          type: boolean
          default: false
          description: Zezwól na wyszukiwanie Bing RSS z bieżącej prośby i odczyt publicznych HTTPS URL prośby lub wyników
        allow_mcp:
          type: boolean
          default: false
          description: Zgoda na lokalny odczyt dokumentacji KripAI przez stały serwer MCP stdio
        allow_github:
          type: boolean
          default: false
          description: Zezwól na odczyt publicznego owner/repo i wyszukiwanie repo po fragmencie bieżącej wiadomości
        document_ids:
          type: array
          maxItems: 5
          default: []
          items: {type: string, format: uuid}
          description: Gotowe indeksy PDF właściciela, wybierane jawnie; bez jednoczesnego attachment_id
      additionalProperties: false
      type: object
      required:
      - text
      - client_message_id
      title: MessageCreate
    Message:
      type: object
      required:
      - id
      - role
      - content
      - created_at
      properties:
        id:
          type: string
          format: uuid
        role:
          enum:
          - user
          - assistant
        content:
          type: string
        created_at:
          type: number
          description: Unix seconds UTC
        attachment_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        sources:
          type: array
          items:
            type: object
            properties:
              ordinal: {type: integer}
              attachment_id: {type: string, format: uuid}
              filename: {type: string}
              page: {type: integer}
              excerpt: {type: string, maxLength: 1000}
        tool_sources:
          type: array
          items:
            type: object
            properties:
              ordinal: {type: integer}
              name: {type: string}
              url: {type: string, format: uri}
              title: {type: string}
              excerpt: {type: string, maxLength: 1200}
    RunCreated:
      type: object
      required:
      - message_id
      - run_id
      - status
      properties:
        message_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        status:
          const: queued
    Run:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        status:
          enum:
          - created
          - queued
          - preparing_context
          - generating
          - validating_tool
          - waiting_approval
          - executing_tool
          - cancelling
          - completed
          - cancelled
          - failed
          - expired
          - outcome_unknown
    SystemStatus:
      type: object
      required:
      - mode
      - database
      - model
      - controller
      - backup
      properties:
        controller:
          description: Stan lokalnego sterownika, nie pomiar wolnej pamięci.
          enum:
          - offline
          - starting
          - ready
          - stopping
          - stopped
          - error
        mode:
          enum:
          - normal
          - gaming
        database:
          enum:
          - ready
          - unavailable
        model:
          enum:
          - ready
          - loading
          - unloaded
          - unavailable
        backup:
          enum:
          - ready
          - error
        profile:
          type: string
          enum:
          - text
          - vision
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
              format: uuid
            retryable:
              type: boolean
    MediaPage:
      properties:
        page:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Page
      additionalProperties: false
      type: object
      required:
      - page
      title: MediaPage
    ImageQuestion:
      properties:
        mode:
          type: string
          enum:
          - ocr
          - question
          title: Mode
          default: question
        question:
          type: string
          maxLength: 1000
          minLength: 1
          title: Question
          default: Opisz ten obraz.
      additionalProperties: false
      type: object
      title: ImageQuestion
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Attachment:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        media_type:
          type: string
        pages:
          type: integer
        current_page:
          type: integer
        text_layer:
          type: string
        analysis:
          type: string
        created_at:
          type: number
  responses:
    Unauthorized:
      description: Brak sesji
    Forbidden:
      description: Brak uprawnienia
    NotFound:
      description: Nie znaleziono lub brak dostępu
    Conflict:
      description: Konflikt stanu lub idempotencji
    Invalid:
      description: Nieprawidłowe dane
    RateLimited:
      description: Limit żądań
    Unavailable:
      description: Usługa niedostępna
